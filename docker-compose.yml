name: forth

x-backend-env: &backend_env
  DATABASE_URL: postgresql://job_seeker:job_seeker@db:5432/job_seeker
  REDIS_URL: redis://redis:6379/0
  JOB_SEEKER_DATA_DIR: /app/data
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-forth-secret-key-change-me-at-least-32-bytes}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_TRUST_PROXY_HEADERS: ${DJANGO_TRUST_PROXY_HEADERS:-0}
  FORTH_PUBLIC_URL: ${FORTH_PUBLIC_URL:-http://localhost:8021}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8021,http://127.0.0.1:8021}
  ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-3072}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
  OPENAI_USAGE_RATES_JSON: ${OPENAI_USAGE_RATES_JSON:-}
  BRAVE_COST_PER_1000_REQUESTS: ${BRAVE_COST_PER_1000_REQUESTS:-5}
  GOTENBERG_URL: http://gotenberg:3000
  SOURCE_HTTP_TIMEOUT_SECONDS: ${SOURCE_HTTP_TIMEOUT_SECONDS:-20}
  # Beat checks due sources every 15 minutes; each source's own schedule_minutes
  # controls whether it is actually queued.
  SOURCE_REFRESH_INTERVAL_SECONDS: ${SOURCE_REFRESH_INTERVAL_SECONDS:-900}
  FORTH_BETA_INVITE_CODE: ${FORTH_BETA_INVITE_CODE:-}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}

x-sandbox: &sandbox
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 1g
  memswap_limit: 1g
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-sandbox: &app_sandbox
  <<: *sandbox
  user: "10001:10001"
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m,mode=1777

services:
  db:
    <<: *sandbox
    networks: [storage]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: job_seeker
      POSTGRES_USER: job_seeker
      POSTGRES_PASSWORD: job_seeker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_seeker -d job_seeker"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    <<: *sandbox
    networks: [storage]
    image: redis:7-alpine
    command: ["redis-server", "--save", "60 1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app_sandbox
    build:
      context: .
    image: forth:latest
    networks: [default, storage, rendering]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      <<: *backend_env
      APP_ROLE: web
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    secrets:
      - openai_api_key
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    <<: *app_sandbox
    image: forth:latest
    networks: [default, storage, rendering]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      <<: *backend_env
      APP_ROLE: worker
      CELERY_WORKER_QUEUES: celery
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    secrets:
      - openai_api_key
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  beat:
    <<: *app_sandbox
    image: forth:latest
    networks: [default, storage, rendering]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      <<: *backend_env
      APP_ROLE: beat
    secrets:
      - openai_api_key
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Started on demand by an MCP client with `docker compose run --rm -i mcp`.
  # It deliberately has no network listener: MCP traffic is stdin/stdout only.
  mcp:
    profiles: [tools]
    <<: *app_sandbox
    image: forth:latest
    networks: [default, storage, rendering]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend_env
      FORTH_MCP_USERNAME: ${FORTH_MCP_USERNAME:-}
      FORTH_MCP_PASSWORD: ${FORTH_MCP_PASSWORD:-}
    secrets:
      - openai_api_key
    volumes:
      - ./data:/app/data
      # Keeps local MCP changes available without rebuilding the web image.
      - ./backend/mcp_server.py:/app/backend/mcp_server.py:ro
    entrypoint: ["python", "mcp_server.py"]
    stdin_open: true

  nginx:
    <<: *sandbox
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,size=8m,mode=1777
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    depends_on:
      web:
        condition: service_started
    ports:
      - "127.0.0.1:8021:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  gotenberg:
    <<: *sandbox
    image: gotenberg/gotenberg:8
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
    networks: [rendering]
    cap_drop: [ALL]
    mem_limit: 1536m
    memswap_limit: 1536m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-auto-start=true
      - --chromium-disable-javascript=true
      - --chromium-deny-private-ips=true
      - --chromium-deny-public-ips=true
      - --api-download-from-deny-private-ips=true
      - --api-download-from-deny-public-ips=true
      - --webhook-deny-private-ips=true
      - --webhook-deny-public-ips=true
      - --libreoffice-disable-routes=true
    restart: unless-stopped

networks:
  storage:
    internal: true
  rendering:
    internal: true

volumes:
  db_data:
    name: ${FORTH_DB_VOLUME:-forth_db_data}
  redis_data:
    name: ${FORTH_REDIS_VOLUME:-forth_redis_data}

secrets:
  openai_api_key:
    file: ./.secrets/openai_api_key
