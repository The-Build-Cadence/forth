log_format forth_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=forth_signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forth_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=forth_connections:10m;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $forth_backend http://web:8000;
    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    server_tokens off;
    access_log /dev/stdout forth_safe;
    limit_conn forth_connections 30;
    limit_req zone=forth_requests burst=80 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /ws/ {
        proxy_pass $forth_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/auth/(login|signup|recovery|reset)/|oauth/(login|token)/) {
        limit_req zone=forth_signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $forth_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass $forth_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
