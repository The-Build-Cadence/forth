
server {
    listen 443 ssl default_server;
    server_name forth.mahfouz.ca;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $forth_backend http://web:8000;
    ssl_certificate /etc/nginx/forth-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/forth-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    server_tokens off;
    access_log /dev/stdout forth_safe;
    limit_conn forth_connections 30;
    limit_req zone=forth_requests burst=80 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    if ($host != forth.mahfouz.ca) { return 444; }

    location /media/ { return 404; }

    location /ws/ {
        proxy_pass $forth_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(api/auth/(login|signup|recovery|reset)/|oauth/(login|token)/) {
        limit_req zone=forth_signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $forth_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass $forth_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
