limit_req_zone $binary_remote_addr zone=forth_signin:10m rate=10r/m;

server {
    listen 443 ssl default_server;
    server_name forth.mahfouz.ca;
    ssl_certificate /etc/nginx/forth-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/forth-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    if ($host != forth.mahfouz.ca) { return 444; }

    location /media/ { return 404; }

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(api/auth/(login|signup)/|oauth/login/) {
        limit_req zone=forth_signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
